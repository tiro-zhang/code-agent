[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.1.0"
description = "终端 AI 对话助手"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "jsonschema>=4.26.0",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
