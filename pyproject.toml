[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.1.0"
description = "终端 AI 对话助手"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "bashlex>=0.18",
    "fastapi>=0.135,<1",
    "httpx2>=2.13.1,<3",
    "jsonschema>=4.26.0",
    "mcp==2.3.0",
    "openai>=3.19.2",
    "prompt-toolkit>=3.0.52,<4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
mewcode = "mewcode.cli:main"
mewcode-eval = "mewcode.evals.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mewcode.skills" = ["builtin/*.md", "builtin/**/*"]
"mewcode.agents" = ["builtin/*.md"]
"mewcode.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
